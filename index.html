<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MemoDremo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    // Максимально безопасная инициализация (без ?.)
    var tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Надежный ловец ошибок
    window.addEventListener('error', function(event) {
      var el = document.getElementById('card-content');
      if (el) {
        el.innerHTML = '<div style="color:#ef4444; font-size:14px; text-align:left; padding: 20px; font-family: monospace;">' +
          '<b>ОШИБКА JS:</b><br>' + event.message + '<br><br>' +
          '<b>Строка:</b> ' + event.lineno + '</div>';
      }
    });
  </script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #6366f1;
      --border: #334155;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html { height: 100%; }
    body { height: 100vh; height: 100dvh; background: var(--bg); color: var(--text); display: flex; flex-direction: column; overflow: hidden; padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); }
    
    .header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #1e293b; flex-shrink: 0; }
    .header h1 { font-size: 1.1rem; color: #818cf8; }
    #counter { color: #94a3b8; font-size: 0.85rem; font-weight: 700; }
    
    .nav-tabs { display: flex; background: #1e293b; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .tab-btn { flex: 1; padding: 12px; background: none; border: none; color: var(--muted); font-weight: 600; font-size: 0.95rem; cursor: pointer; }
    .tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
    
    .content-area { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 12px; }
    .tab-panel { display: none; flex: 1; min-height: 0; flex-direction: column; }
    .tab-panel.active { display: flex; }
    
    #drill-tab .card { flex: 1; min-height: 0; }
    #decks-tab { overflow-y: auto; }
    
    .card { position: relative; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border); padding: 24px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; cursor: pointer; margin-bottom: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
    #card-content { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; width: 100%; height: 100%; }
    
    .tag { position: absolute; top: 16px; left: 16px; font-size: 0.75rem; background: rgba(99, 102, 241, 0.2); color: #818cf8; padding: 6px 12px; border-radius: 12px; }
    .drama-title { font-size: 1rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .main-text { font-size: 2rem; font-weight: 700; color: #fff; line-height: 1.3; }
    .ipa-text { font-size: 1.2rem; color: #94a3b8; font-style: italic; line-height: 1.4; }
    
    .audio-btn { background: var(--accent); border: none; color: #fff; width: 64px; height: 64px; border-radius: 50%; font-size: 1.8rem; display: flex; align-items: center; justify-content: center; margin-top: 10px; cursor: pointer; box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.4); }
    
    .controls { display: flex; gap: 10px; flex-shrink: 0; padding-bottom: 5px; }
    .action-btn { flex: 1; padding: 16px; border-radius: 14px; border: none; font-weight: 600; font-size: 1rem; cursor: pointer; }
    .btn-up { background: var(--accent); color: white; }
    .btn-down { background: var(--border); color: var(--text); }
    
    #decks-tab h3 { margin-bottom: 10px; color: #818cf8; }
    #decks-list { display: flex; flex-direction: column; gap: 10px; }
    .deck-item { background: var(--card-bg); border: 1px solid var(--border); padding: 16px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .deck-item input[type="checkbox"] { transform: scale(1.5); accent-color: var(--accent); flex-shrink: 0; }
    
    .danger-btn { margin-top: 16px; width: 100%; padding: 14px; border-radius: 14px; border: 1px solid #7f1d1d; background: rgba(127, 29, 29, 0.3); color: #fca5a5; font-weight: 600; font-size: 0.95rem; cursor: pointer; }
    .sync-note { margin-top: 12px; font-size: 0.8rem; color: var(--muted); text-align: center; line-height: 1.4; }
    
    .version-mark { position: fixed; bottom: 5px; right: 5px; font-size: 10px; color: #475569; z-index: 999; }
  </style>
</head>
<body>

  <div class="header">
    <h1>MemoDremo</h1>
    <span id="counter"></span>
  </div>

      <div class="controls">

    </div>

    <div id="decks-tab" class="tab-panel">

      <button class="danger-btn" id="btn-reset">Сбросить прогресс</button>
      <div class="sync-note" id="sync-note"></div>
    </div>
  </div>

  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const temp = array[i];
      array[i] = array[j];
      array[j] = temp;
    }
    return array;
