<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MemoDremo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #6366f1;
      --border: #334155;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html { height: 100%; }

    body {
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }

    .header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      flex-shrink: 0;
    }

    .header h1 { font-size: 1.1rem; color: #818cf8; }

    #counter {
      color: #94a3b8;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .nav-tabs {
      display: flex;
      background: #1e293b;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom: 2px solid var(--accent);
    }

    .content-area {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 12px;
    }

    .tab-panel {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
    }

    .tab-panel.active { display: flex; }

    #drill-tab .card { flex: 1; min-height: 0; }
    #decks-tab { overflow-y: auto; }

    .card {
      position: relative; 
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      margin-bottom: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    #card-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      height: 100%;
    }

    .tag {
      position: absolute;
      top: 16px;
      left: 16px;
      font-size: 0.75rem;
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      padding: 6px 12px;
      border-radius: 12px;
    }

    .drama-title {
      font-size: 1rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .main-text {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
    }

    .ipa-text {
      font-size: 1.2rem;
      color: #94a3b8;
      font-style: italic;
      line-height: 1.4;
    }

    .audio-btn {
      background: var(--accent);
      border: none;
      color: #fff;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.4);
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      padding-bottom: 5px;
    }

    .action-btn {
      flex: 1;
      padding: 16px;
      border-radius: 14px;
      border: none;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }

    .btn-up { background: var(--accent); color: white; }
    .btn-down { background: var(--border); color: var(--text); }

    .restart-btn { margin-top: 8px; max-width: 220px; }

    #decks-tab h3 {
      margin-bottom: 10px;
      color: #818cf8;
    }

    #decks-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .deck-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .deck-item input[type="checkbox"] {
      transform: scale(1.5);
      accent-color: var(--accent);
      flex-shrink: 0;
    }

    .danger-btn {
      margin-top: 16px;
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #7f1d1d;
      background: rgba(127, 29, 29, 0.3);
      color: #fca5a5;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .sync-note {
      margin-top: 12px;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>MemoDremo</h1>
    <span id="counter"></span>
  </div>

  <div class="nav-tabs">
    <button id="tab-drill" class="tab-btn active" onclick="switchTab('drill')">Учить</button>
    <button id="tab-decks" class="tab-btn" onclick="switchTab('decks')">Темы</button>
  </div>

  <div class="content-area">
    <div id="drill-tab" class="tab-panel active">
      <div class="card" onclick="flipCard()">
        <div id="card-content"></div>
      </div>
      <div class="controls">
        <button class="action-btn btn-up" onclick="swipeCard('up', event)">▲ Снова</button>
        <button class="action-btn btn-down" onclick="swipeCard('down', event)">▼ Помню</button>
      </div>
    </div>

    <div id="decks-tab" class="tab-panel">
      <h3>Выберите темы для изучения:</h3>
      <div id="decks-list"></div>
      <button class="danger-btn" onclick="resetProgress()">Сбросить прогресс</button>
      <div class="sync-note" id="sync-note"></div>
    </div>
  </div>

    { id: 'c196', drama: "Лёгок на помине", memo: "Speak of the devil", ipa: "[spiːk əv ðə ˈdevl]", deck: "Идиомы и устойчивые выражения" },
    { id: 'c197', drama: "Кот наплакал", memo: "Next to nothing", ipa: "[nekst tuː ˈnʌθɪŋ]", deck: "Идиомы и устойчивые выражения" },
    { id: 'c198', drama: "С глазу на глаз", memo: "Face to face", ipa: "[feɪs tuː feɪs]", deck: "Идиомы и устойчивые выражения" },
    { id: 'c199', drama: "Из кожи вон лезть", memo: "Go the extra mile", ipa: "[ɡoʊ ði ˈekstrə maɪl]", deck: "Идиомы и устойчивые выражения" },
    { id: 'c200', drama: "Время летит", memo: "Time flies", ipa: "[taɪm flaɪz]", deck: "Идиомы и устойчивые выражения" }
  ];

  const STORAGE_KEY = 'memodremo_state_v3';
  const telegram = window.Telegram?.WebApp;
  const cloudStorage = telegram?.CloudStorage;

  const allDecks = [...new Set(ALL_CARDS.map((card) => card.deck))];

  let state = {
    decks: [...allDecks],
    remaining: null,
    completed: []
  };

  let flipped = false;
  let current = null;
  let saveTimer = null;

  function activeCards() {
    return ALL_CARDS.filter((card) => state.decks.includes(card.deck));
  }

  function cardById(id) {
    return ALL_CARDS.find((card) => card.id === id) || null;
  }

  function shuffle(array) {
    const result = [...array];
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }

  function startSession() {
    const cards = activeCards();
    state.remaining = cards.length ? shuffle(cards).map((card) => card.id) : [];
    state.completed = [];
    flipped = false;
    current = state.remaining.length ? cardById(state.remaining[0]) : null;
    saveSoon();
    render();
  }

  function rebuildCurrent() {
    current = state.remaining && state.remaining.length
      ? cardById(state.remaining[0])
      : null;
  }

  function saveSoon() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 300);
  }

  function saveNow() {
    const payload = JSON.stringify(state);

    try {
      localStorage.setItem(STORAGE_KEY, payload);
    } catch (error) {
      console.warn('localStorage save failed:', error);
    }

    if (cloudStorage) {
      try {
        cloudStorage.setItem(STORAGE_KEY, payload, (error) => {
          if (error) console.warn('CloudStorage save failed:', error);
        });
      } catch (error) {
        console.warn('CloudStorage save error:', error);
      }
    }
  }

  function readLocalState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (error) {
      return null;
    }
  }

  function loadState() {
    return new Promise((resolve) => {
      const fromLocal = () => resolve(readLocalState());

      if (!cloudStorage) {
        fromLocal();
        return;
      }

      try {
        cloudStorage.getItem(STORAGE_KEY, (error, value) => {
          if (error) {
            console.warn('CloudStorage load failed:', error);
            fromLocal();
            return;
          }

          if (value) {
            try {
              resolve(JSON.parse(value));
              return;
            } catch (parseError) {
              console.warn('CloudStorage parse failed:', parseError);
            }
          }

          fromLocal();
        });
      } catch (error) {
        console.warn('CloudStorage load error:', error);
        fromLocal();
      }
    });
  }

  function applyLoadedState(saved) {
    if (!saved || typeof saved !== 'object') {
      startSession();
      return;
    }

    if (Array.isArray(saved.decks)) {
      state.decks = saved.decks.filter((deck) => allDecks.includes(deck));
    }

    if (!Array.isArray(saved.remaining)) {
      startSession();
      return;
    }

    const activeIds = new Set(activeCards().map((card) => card.id));
    const completedSet = new Set(Array.isArray(saved.completed) ? saved.completed : []);

    let remaining = saved.remaining.filter((id) => activeIds.has(id));

    const knownIds = new Set(remaining);
    const trulyNew = [...activeIds].filter(
      (id) => !knownIds.has(id) && !completedSet.has(id)
    );
    remaining = [...remaining, ...trulyNew];

    state.remaining = remaining;
    state.completed = [...completedSet].filter((id) => activeIds.has(id));

    rebuildCurrent();
    flipped = false;
    render();
  }

  function initTelegram() {
    const syncNote = document.getElementById('sync-note');

    if (!telegram) {
      syncNote.textContent =
        'Прогресс сохраняется в этом браузере. Открой приложение через Telegram, чтобы синхронизировать его между устройствами.';
      return;
    }

    try {
      telegram.ready();
      telegram.expand();
      telegram.setHeaderColor('#1e293b');
      telegram.setBackgroundColor('#0f172a');
    } catch (error) {
      console.warn('Telegram init warning:', error);
    }

    if (cloudStorage) {
      syncNote.textContent =
        'Прогресс синхронизируется с вашим аккаунтом Telegram.';
    } else {
      syncNote.textContent =
        'Облачное хранилище недоступно — прогресс сохраняется на этом устройстве.';
    }
  }

  function haptic(style = 'light') {
    try {
      telegram?.HapticFeedback?.impactOccurred(style);
    } catch (error) {
      // игнорируем
    }
  }

  function updateCounter() {
    const total = activeCards().length;
    const counter = document.getElementById('counter');

    if (total === 0) {
      counter.textContent = 'Нет тем';
      return;
    }

    const left = state.remaining ? state.remaining.length : total;
    counter.textContent = `Осталось: ${left} / ${total}`;
  }

  function render() {
    updateCounter();

    if (state.remaining === null) {
      document.getElementById('card-content').innerHTML =
        '<div class="ipa-text">Загрузка…</div>';
      return;
    }

    renderCard();
  }

  function renderCard() {
    const cardContent = document.getElementById('card-content');
    const total = activeCards().length;

    if (total === 0) {
      cardContent.innerHTML = `
        <div class="tag">Пусто</div>
        <div class="main-text">Выберите хотя бы одну тему</div>
        <div class="ipa-text">Откройте вкладку «Темы»</div>
      `;
      return;
    }

    if (!current) {
      cardContent.innerHTML = `
        <div class="tag">Готово</div>
        <div class="main-text">Все карточки повторены</div>
        <div class="ipa-text">Можно начать заново или изменить темы</div>
        <button class="action-btn btn-up restart-btn" type="button">Начать заново</button>
      `;

      const restartBtn = cardContent.querySelector('.restart-btn');
      if (restartBtn) {
        restartBtn.addEventListener('click', (event) => {
          event.stopPropagation();
          startSession();
        });
      }

      return;
    }

    if (!flipped) {
      cardContent.innerHTML = `
        <div class="tag">${current.deck}</div>
        <div class="drama-title">Вопрос</div>
        <div class="main-text">${current.drama}</div>
        <div class="ipa-text">Нажмите на карточку, чтобы увидеть ответ</div>
      `;
      return;
    }

    cardContent.innerHTML = `
      <div class="tag">${current.deck}</div>
      <div class="drama-title">Ответ</div>
      <div class="main-text">${current.memo}</div>
      <div class="ipa-text">${current.ipa}</div>
      <button class="audio-btn" type="button" aria-label="Прослушать">🔊</button>
    `;

    const audioBtn = cardContent.querySelector('.audio-btn');
    if (audioBtn) {
      audioBtn.addEventListener('click', (event) => {
        event.stopPropagation();
        speak(current.memo);
      });
    }
  }

  function renderDecks() {
    const list = document.getElementById('decks-list');
    list.innerHTML = '';

    allDecks.forEach((deck) => {
      const label = document.createElement('label');
      label.className = 'deck-item';

      const title = document.createElement('span');
      title.textContent = deck;

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = state.decks.includes(deck);
      checkbox.dataset.deck = deck;

      checkbox.addEventListener('change', () => {
        if (checkbox.checked) {
          if (!state.decks.includes(deck)) state.decks.push(deck);
        } else {
          state.decks = state.decks.filter((item) => item !== deck);
        }

        startSession();
        renderDecks();
      });

      label.appendChild(title);
      label.appendChild(checkbox);
      list.appendChild(label);
    });
  }

  function flipCard() {
    if (!current) return;
    flipped = !flipped;
    haptic('soft');
    renderCard();
  }

  function swipeCard(direction, event) {
    if (event) event.stopPropagation();
    if (!current || !state.remaining) return;

    haptic('light');

    if (direction === 'down') {
      const id = state.remaining.shift();
      if (!state.completed.includes(id)) state.completed.push(id);
    } else {
      const id = state.remaining.shift();
      state.remaining.push(id);
    }

    rebuildCurrent();
    flipped = false;
    saveSoon();
    render();
  }

  function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach((button) => {
      button.classList.toggle('active', button.id === `tab-${name}`);
    });

    document.querySelectorAll('.tab-panel').forEach((panel) => {
      panel.classList.toggle('active', panel.id === `${name}-tab`);
    });

    if (name === 'decks') renderDecks();
  }

  function resetProgress() {
    const confirmed = window.confirm('Сбросить прогресс и начать все карточки заново?');
    if (!confirmed) return;

    startSession();
  }

  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
  }

  async function boot() {
    initTelegram();
    renderDecks();
    render();

    const saved = await loadState();
    applyLoadedState(saved);
    renderDecks();

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') saveNow();
    });

    window.addEventListener('pagehide', saveNow);

    if (telegram) {
      try {
        telegram.onEvent('viewportChanged', () => {});
      } catch (error) {
        // не критично
      }
    }
  }

  boot();
</script>
